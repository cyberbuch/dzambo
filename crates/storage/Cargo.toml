[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
diesel = { version = "2.2", default-features = false, features = ["postgres", "numeric", "chrono", "serde_json", "64-column-tables"] }
diesel-async = { version = "0.10", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = "2"
bigdecimal = "0.4"
serde_json = { workspace = true }
thiserror = "2"
chrono = { workspace = true }
tracing = { workspace = true }
domain = { path = "../domain" }
tokio = { workspace = true }
